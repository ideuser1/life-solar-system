  const friendsCache = {}; // code → {summary, updated} or {error}
  const safeColor = c => /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? c : '#7aa2ff';
  function timeAgo(iso){
    const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 2) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const h = Math.round(mins / 60);
    if (h < 36) return h + ' h ago';
    return Math.round(h / 24) + ' d ago';
  }

  async function fetchFriend(code){
    try{
      const res = await fetch(HUB_URL + '/api/system/' + encodeURIComponent(code), { cache: 'no-store' });
      if (res.status === 404){ friendsCache[code] = { error: 'Nothing shared under this code — check it, or they may have stopped sharing.' }; return; }
      if (!res.ok){ friendsCache[code] = { error: 'The hub had a problem — try again later.' }; return; }
      friendsCache[code] = await res.json();
      // adopt the name from their sun automatically ("sun-…" codes are for machines)
      const nm = String(((friendsCache[code] || {}).summary || {}).name || '').slice(0, 30);
      if (nm){
        const ns = social.get();
        const fr = (ns.friends || []).find(x => x.code === code);
        if (fr && fr.name !== nm){ fr.name = nm; social.save(ns); }
      }
      if (friendsCache[code].summary) updateFriendFeed(code, nm || 'A friend', friendsCache[code].summary);
    }catch(e){ friendsCache[code] = { error: 'Couldn’t reach the hub — are you online?' }; }
  }

  // "Lately": notice what changed in a friend's shared summary since last look
  function updateFriendFeed(code, name, summary){
    const snaps = store.get('__friendSnaps', {});
    const prev = snaps[code];
    const now = {};
    (summary.areas || []).slice(0, 30).forEach(a => {
      now[a.label] = { active: !!a.active, goals: (a.goals || []).slice(0, 20).map(g => String(g.title || '').slice(0, 80)) };
    });
    const events = [];
    if (prev){ // first fetch is just a baseline — no events
      Object.entries(now).forEach(([label, cur]) => {
        const p = prev[label];
        if (!p){ events.push(`🪐 ${name} added a new planet: ${label}`); return; }
        if (!p.active && cur.active) events.push(`🌱 ${name}'s ${label} planet woke up`);
        cur.goals.forEach(t => { if (!p.goals.includes(t)) events.push(`✨ ${name} added “${t}” to ${label}`); });
      });
    }
    snaps[code] = now;
    store.set('__friendSnaps', snaps);
    if (events.length){
      const feed = store.get('__friendFeed', []);
      const day = todayISO();
      events.slice(0, 5).forEach(msg => feed.push({ t: day, msg: msg.slice(0, 160) }));
      store.set('__friendFeed', feed.slice(-20));
      if (friendsWrap.style.display === 'block') buildFriends();
    }
  }
  function refreshFriends(){
    (social.get().friends || []).forEach(f => fetchFriend(f.code).then(() => {
      if (friendsWrap.style.display === 'block') buildFriends();
    }));
  }

  // ---- celebrations: a little burst of confetti where good things happen ----
  function celebrate(x, y, big){
    const n = big ? 80 : 26;
    const cont = document.createElement('div');
    cont.className = 'burst';
    document.body.appendChild(cont);
    const colors = ['#ffd166', '#3ecf8e', '#7aa2ff', '#ff8fd8', '#ff9d76', '#8fd3ff'];
    for (let i = 0; i < n; i++){
      const p = document.createElement('span');
      const ang = Math.random() * 2 * Math.PI;
      const dist = (big ? 260 : 120) * (0.4 + Math.random() * 0.6);
      p.style.background = colors[i % colors.length];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist - (big ? 60 : 30) + 'px');
      p.style.animationDelay = (Math.random() * 0.1) + 's';
      cont.appendChild(p);
    }
    setTimeout(() => cont.remove(), 1700);
  }

  // ---- waves & kudos: tiny greetings delivered via the hub inbox ----
  async function sendWave(code, kind, target, btn){
    try{
      await fetch(HUB_URL + '/api/wave/' + encodeURIComponent(code), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          kind,
          target: target || '',
          from: String(cfg.sunLabel || 'A friend').slice(0, 40),
          fromCode: social.get().code || '',
        }),
      });
      if (btn){ btn.disabled = true; btn.textContent = kind === 'kudos' ? '🎉✓' : '👋 Waved!'; }
    }catch(e){
      if (btn) btn.textContent = 'Offline?';
    }
  }
  async function checkInbox(){
    const s = social.get();
    if (!s.on || !s.code || !s.writeKey) return;
    try{
      const res = await fetch(HUB_URL + '/api/wave/' + s.code + '?key=' + s.writeKey, { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      (data.items || []).filter(it => it.kind === 'unfriend').forEach(handleUnfriend);
      (data.items || []).filter(it => it.kind !== 'unfriend')
        .slice(0, 6).forEach((it, i) => setTimeout(() => showToast(it), i * 700));
    }catch(e){ /* offline — greetings will still be waiting next time */ }
  }
  // a friend removed us — drop them from our list too (mutual unfriending)
  function handleUnfriend(it){
    const code = String(it.fromCode || '');
    if (!code) return;
    const ns = social.get();
    if (!(ns.friends || []).some(f => f.code === code)) return;
    ns.friends = ns.friends.filter(f => f.code !== code);
    social.save(ns);
    const snaps = store.get('__friendSnaps', {});
    delete snaps[code];
    store.set('__friendSnaps', snaps);
    delete friendsCache[code];
    if (friendsWrap.style.display === 'block') buildFriends();
    showToast({ kind: 'info', msg: 'You and ' + String(it.from || 'a friend').slice(0, 40) + ' are no longer connected.' });
  }
  // "Deleted — Undo" safety net (same toast stack as waves/kudos)
  function offerUndo(text, onUndo){
    let cont = document.getElementById('toasts');
    if (!cont){
      cont = document.createElement('div');
      cont.id = 'toasts';
      document.body.appendChild(cont);
    }
    const div = document.createElement('div');
    div.className = 'toast';
    div.innerHTML = `${escAttr(text.slice(0, 90))} <button class="ics-btn" style="margin-left:8px;padding:4px 12px;">Undo</button>`;
    div.querySelector('button').addEventListener('click', () => { onUndo(); div.remove(); });
    cont.appendChild(div);
    setTimeout(() => div.classList.add('show'), 30);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 8000);
  }

  function showToast(it){
    let cont = document.getElementById('toasts');
    if (!cont){
      cont = document.createElement('div');
      cont.id = 'toasts';
      document.body.appendChild(cont);
    }
    const div = document.createElement('div');
    div.className = 'toast';
    const who = escAttr(String(it.from || 'A friend').slice(0, 40));
    if (it.kind === 'info') div.innerHTML = `🍂 ${escAttr(String(it.msg || '').slice(0, 120))}`;
    else if (it.kind === 'kudos') div.innerHTML = `🎉 <b>${who}</b> sent kudos${it.target ? ' on “' + escAttr(String(it.target).slice(0, 80)) + '”' : ''}!`;
    else div.innerHTML = `👋 <b>${who}</b> waved at you!`;
    cont.appendChild(div);
    if (it.kind !== 'info') celebrate(window.innerWidth - 120, 70, false);
    setTimeout(() => div.classList.add('show'), 30);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 8000);
  }

  // a friend's summary is someone else's text — escape everything we render
  function friendCard(f){
    const c = friendsCache[f.code];
    let body;
    if (!c) body = '<p class="fr-note">Loading…</p>';
    else if (c.error) body = `<p class="fr-err">${escAttr(c.error)}</p>`;
    else {
      const sum = c.summary || {};
      const planets = (sum.areas || []).slice(0, 30).map(a =>
        `<span class="fr-planet"><span class="fr-dot ${a.active ? 'glow' : ''}" style="background:${safeColor(a.color)}"></span>${escAttr(String(a.label || '').slice(0, 40))}</span>`
      ).join('');
      body = `<div class="fr-planets">${planets || '<span class="fr-note">Nothing shared yet.</span>'}</div>
        <p class="fr-visit">Visit their solar system →</p>`;
    }
    return `<div class="fr-card" ${c && !c.error ? `data-code="${escAttr(f.code)}"` : ''}>
      <div class="fr-head"><p class="fr-name">${escAttr(f.name || f.code)}</p>
      <span class="fr-updated">${c && c.updated ? escAttr(timeAgo(c.updated)) + ' ' : ''}<button class="ics-btn fr-wave" data-code="${escAttr(f.code)}" title="Send a wave">👋</button><button class="ed-del fr-del" data-code="${escAttr(f.code)}" title="Remove friend" aria-label="Remove friend">${TRASH_SVG}</button></span></div>
      ${body}
    </div>`;
  }

  function buildFriends(){
    const el = document.getElementById('friends');
    const s = social.get();

    const banner = `
      <div class="fr-banner ${s.on ? 'is-pub' : ''}">
        <p class="fr-banner-title">${s.on ? '🌍 Your solar system is PUBLIC' : '🔒 Your solar system is PRIVATE'}</p>
        <p class="fr-banner-text">${s.on
          ? 'People you give your friend code to can <b>see</b> your planet names, colors, and glow' + (s.shareTitles ? ' — and your goal titles' : ' (goal titles are NOT shared)') + '. They can never change anything. Uncheck planets below to hide them, or go private with one click.'
          : 'Nothing about your solar system leaves this dashboard — no one can see it, not even with a friend code. Go public to get a friend code and share only what you choose.'}</p>
        <button class="ics-btn pub-toggle ${s.on ? 'is-pub' : ''}" id="frToggle">${s.on ? 'Make it private 🔒' : 'Go public 🌍'}</button>
      </div>`;
    let sharing;
    if (!s.on){
      sharing = banner;
    } else {
      const planetRows = cfg.areas.map(a =>
        `<label class="fr-check"><input type="checkbox" class="fr-p" data-label="${escAttr(a.label)}" ${(s.hidden || []).includes(a.label) ? '' : 'checked'}><span class="fr-dot" style="background:${safeColor(a.color)}"></span>${escAttr(a.label)}</label>`
      ).join('');
      sharing = `
        ${banner}
        <p class="fr-note" style="margin-top:14px;">Your friend code:</p>
        <span class="fr-code">${escAttr(s.code)}</span><button class="ics-btn" id="frCopy">Copy</button>
        <button class="ics-btn" id="frNewCode" title="Lock out everyone who has the old code">🔄 New code</button>
        <p class="fr-note">Removing a friend below disconnects both of you. If someone might re-add your code anyway, <b>New code</b> is the stronger option: the old code stops working for everyone, and you re-send the new one to friends you keep.</p>
        <p class="note-label" style="margin-top:18px;">What friends can see</p>
        <label class="fr-check"><input type="checkbox" id="frTitles" ${s.shareTitles ? 'checked' : ''}><b>Share goal titles</b>&nbsp;(uncheck to keep every goal private)</label>
        ${planetRows}
        <p class="fr-note">Unchecked planets are private — nothing about them is sent anywhere. "Done" goals are never shared.</p>`;
    }

    const sc = syncCode.get();
    let devices;
    if (sc){
      devices = `
        <p class="fr-note">This is your <b>account code</b> — no login, no password, this code IS your account. Type it on any device or browser and your whole dashboard appears there. It's also your <b>backup</b>: even if this browser's data is wiped, the code brings everything back. <b>Treat it like a password</b> — anyone who has it can see and change everything.</p>
        <span class="fr-code">${escAttr(sc)}</span><button class="ics-btn" id="syCopy">Copy</button>
        <div class="ed-actions"><button class="ics-btn" id="syStop">Disconnect this device</button></div>`;
    } else if (cloudSync.siteHasLegacy){
      devices = `<p class="fr-note">This copy already syncs and backs itself up on its own — just open this same website address on your other devices ("Add to Home Screen" on your phone makes it an app). No code needed.</p>`;
    } else {
      devices = `
        <p class="fr-note">Right now this dashboard lives only in this browser — if the browser's data is ever cleared, it's gone. Turn on backup to get a private <b>account code</b> (no signup, no password): it keeps a copy safe in the cloud and opens your dashboard on any device you type it into.</p>
        <div class="ed-actions"><button class="ics-btn" id="syStart">Turn on backup & sync</button></div>
        <div class="fr-row"><input class="fr-input" id="syCode" placeholder="Already have an account code? Enter it here"><button class="ics-btn" id="syConnect">Connect</button></div>
        <p class="fr-err" id="syErr" style="display:none;"></p>`;
    }

    const list = (s.friends || []).map(friendCard).join('');
    el.innerHTML = `
      <p class="tl-month">Your sharing</p><div class="fr-section">${sharing}</div>
      <p class="tl-month">Your account & backup</p><div class="fr-section">${devices}</div>
      <p class="tl-month">Your friends</p>
      <div class="fr-row">
        <input class="fr-input" id="frAddCode" placeholder="Paste a friend code (e.g. sun-abc23-def45)">
        <button class="ics-btn" id="frAdd">Add</button>
      </div>
      ${list || '<p class="fr-note">No friends yet. Swap friend codes with someone who has their own solar system!</p>'}
      ${(() => {
        const feed = store.get('__friendFeed', []);
        if (!feed.length) return '';
        return '<p class="tl-month">Lately</p>' + feed.slice().reverse().map(e =>
          `<p class="fr-note">${escAttr(e.msg)} <span style="color:var(--ink-muted)">· ${escAttr(fmtShortDate(e.t))}</span></p>`).join('');
      })()}`;

    const on = (sel, ev, fn) => { const n = el.querySelector(sel); if (n) n.addEventListener(ev, fn); };
    on('#frToggle', 'click', () => {
      const ns = social.get();
      if (ns.on){
        if (!confirm('Go private? Your summary is removed from the hub and your code stops working for friends.')) return;
        ns.on = false;
        social.unpublish(ns);
      } else {
        ns.on = true;
        if (!ns.code){ ns.code = social.randomCode(); ns.writeKey = social.randomKey(); ns.shareTitles = true; }
      }
      social.save(ns);
      buildFriends();
    });
    on('#frCopy', 'click', () => {
      if (navigator.clipboard) navigator.clipboard.writeText(social.get().code);
      el.querySelector('#frCopy').textContent = 'Copied ✓';
    });
    on('#frNewCode', 'click', () => {
      if (!confirm('Get a new friend code? Everyone with your old code loses access immediately. Send the new code to the friends you want to keep.')) return;
      const ns = social.get();
      social.unpublish({ code: ns.code, writeKey: ns.writeKey }); // old code dies now
      ns.code = social.randomCode();
      ns.writeKey = social.randomKey();
      social.save(ns); // re-publishes under the new code
      buildFriends();
    });
    on('#syStart', 'click', () => {
      syncCode.set(syncCode.gen());
      cloudSync.push(); // seed the cloud copy from this device
      buildFriends();
    });
    on('#syCopy', 'click', () => {
      if (navigator.clipboard) navigator.clipboard.writeText(syncCode.get());
      el.querySelector('#syCopy').textContent = 'Copied ✓';
    });
    on('#syStop', 'click', () => {
      if (!confirm('Disconnect this device from your account code? Your data stays here and in the cloud backup — this device just stops updating it.')) return;
      syncCode.set('');
      buildFriends();
    });
    on('#syConnect', 'click', async () => {
      const codeIn = el.querySelector('#syCode');
      const errEl = el.querySelector('#syErr');
      const c = codeIn.value.trim().toLowerCase();
      if (!c) return;
      errEl.style.display = 'none';
      try{
        const res = await fetch(HUB_BASE + '/api/sync/' + encodeURIComponent(c), { cache: 'no-store' });
        if (!res.ok){
          errEl.textContent = res.status === 404
            ? 'Nothing found under that code — press "Sync my devices" on your FIRST device, then enter the code it shows here.'
            : 'The hub had a problem — try again in a moment.';
          errEl.style.display = 'block';
          return;
        }
        syncCode.set(c);
        await cloudSync.pull(() => { applyConfig(); build(); });
        cloudSync.push(); // upload the merged result
        buildFriends();
      }catch(e){
        errEl.textContent = 'Couldn’t reach the hub — are you online?';
        errEl.style.display = 'block';
      }
    });
    on('#frTitles', 'change', () => {
      const ns = social.get();
      ns.shareTitles = el.querySelector('#frTitles').checked;
      social.save(ns);
      buildFriends();
    });
    el.querySelectorAll('.fr-p').forEach(cb => cb.addEventListener('change', () => {
      const ns = social.get();
      ns.hidden = (ns.hidden || []).filter(l => l !== cb.dataset.label);
      if (!cb.checked) ns.hidden.push(cb.dataset.label);
      social.save(ns);
      buildFriends();
    }));
    on('#frAdd', 'click', () => {
      const code = el.querySelector('#frAddCode').value.trim().toLowerCase();
      if (!code) return;
      const ns = social.get();
      ns.friends = ns.friends || [];
      if (!ns.friends.some(f => f.code === code)) ns.friends.push({ code }); // name arrives with their summary
      social.save(ns);
      buildFriends();
      refreshFriends();
    });
    el.querySelectorAll('.fr-del').forEach(btn => btn.addEventListener('click', () => {
      if (!confirm('Remove this friend? You will disappear from each other\'s lists.')) return;
      const code = btn.dataset.code;
      sendWave(code, 'unfriend', '', null); // tell their dashboard to drop us too
      const ns = social.get();
      ns.friends = (ns.friends || []).filter(f => f.code !== code);
      social.save(ns);
      const snaps = store.get('__friendSnaps', {});
      delete snaps[code];
      store.set('__friendSnaps', snaps);
      delete friendsCache[code];
      buildFriends();
    }));
    el.querySelectorAll('.fr-wave').forEach(btn => btn.addEventListener('click', e => {
      e.stopPropagation(); // don't also open the visit
      sendWave(btn.dataset.code, 'wave', '', btn);
    }));
    el.querySelectorAll('.fr-card[data-code]').forEach(card => card.addEventListener('click', e => {
      if (e.target.closest('.fr-del') || e.target.closest('.fr-wave')) return; // buttons are not doors
      const code = card.dataset.code;
      const f = (social.get().friends || []).find(x => x.code === code);
      const c = friendsCache[code];
      if (f && c && !c.error) enterVisit(f, c);
    }));
  }

  // ---- visiting: fly over to a friend's solar system, read-only ----
  // Their summary becomes a temporary config in the normal orbit view; the
  // editors, view toggle, and publishing are all disabled until Back.
  function friendConfig(f, data){
    const sum = data.summary || {};
    const name = f.name || sum.name || 'Friend';
    const capName = name.charAt(0).toUpperCase() + name.slice(1);
    return {
      title: capName + "'s Solar System",
      subtitle: "You're visiting" + (data.updated ? ' · last updated ' + timeAgo(data.updated) : ''),
      sunLabel: sum.name || name,
      footer: 'Click a planet to look around — nothing here can be changed.',
      areas: (sum.areas || []).slice(0, 30).map(a => ({
        label: String(a.label || '').slice(0, 40),
        color: safeColor(a.color),
        __active: !!a.active,
        goals: (a.goals || []).slice(0, 20).map(g => ({
          title: String(g.title || '').slice(0, 120),
          status: g.on ? 'ongoing' : 'someday',
        })),
      })),
    };
  }
  function enterVisit(f, data){
    closePanel();
    visiting = { prevCfg: cfg, code: f.code, name: f.name || '' };
    const wb = document.getElementById('waveBtn');
    wb.disabled = false;
    wb.textContent = '👋 Wave';
    cfg = friendConfig(f, data);
    document.body.classList.add('visiting');
    setHeaderText();
    setView('system');
    build();
  }
  function exitVisit(){
    closePanel();
    cfg = visiting.prevCfg;
    visiting = null;
    document.body.classList.remove('visiting');
    setHeaderText();
    build();
    setView('friends');
  }
  document.getElementById('backBtn').addEventListener('click', exitVisit);
  document.getElementById('waveBtn').addEventListener('click', () => {
    if (visiting) sendWave(visiting.code, 'wave', '', document.getElementById('waveBtn'));
  });

  // ---- first-run setup wizard ----
  // Shown when data.js says `setup: true` and nothing has been saved yet
  // (fresh visitor). Builds a personal config with NO example goals and
  // stores it as __config, exactly as if they'd used the in-page editors.
  const SETUP_PLANETS = [
    { label: 'Work',    color: '#7aa2ff', hint: 'career, business, your main thing' },
    { label: 'School',  color: '#b48cff', hint: 'classes, degrees, learning' },
    { label: 'Money',   color: '#ff8fa3', hint: 'earning, saving, investing' },
    { label: 'Body',    color: '#5fd0c7', hint: 'fitness, sleep, food, health' },
    { label: 'Mind',    color: '#8fd3ff', hint: 'mental health, mindfulness' },
    { label: 'People',  color: '#ff9d76', hint: 'family, friends, romance' },
    { label: 'Growth',  color: '#5cb85c', hint: 'skills, reading, curiosity' },
    { label: 'Play',    color: '#ff8fd8', hint: 'fun, adventure, hobbies' },
    { label: 'Home',    color: '#d9b26a', hint: 'your space, life admin' },
    { label: 'Purpose', color: '#b9a7f0', hint: 'meaning, giving back' },
  ];
  let setupEl = null;
  const setupState = { step: 1, name: '', picked: [], custom: [], goals: {}, aboutMe: '', footer: '' };

  function setupHTML(){
    const s = setupState;
    if (s.step === 1) return `
      <h2>Welcome to your solar system 🌞</h2>
      <p class="su-sub">You're about to be the sun, with the parts of your life orbiting you
      as planets. First things first — what should we call the sun?</p>
      <input class="fr-input" id="suName" placeholder="Your name" value="${escAttr(s.name)}" maxlength="30" style="width:100%;">
      <div class="su-actions"><button class="ics-btn" id="suNext">Next</button><button class="su-skip" id="suSkip">Skip setup</button></div>`;
    if (s.step === 2) return `
      <h2>Pick your planets</h2>
      <p class="su-sub">Which parts of life do you want orbiting you? Tap to choose — most
      people keep 4–7. You can rename, recolor, add, or remove planets anytime later.</p>
      <div class="su-chips">
        ${SETUP_PLANETS.map(p => `<button class="su-chip ${s.picked.includes(p.label) ? 'sel' : ''}" data-label="${p.label}" title="${p.hint}"><span class="fr-dot" style="background:${p.color}"></span>${p.label}</button>`).join('')}
        ${s.custom.map(c => `<button class="su-chip sel" data-custom="${escAttr(c)}" title="Click to remove"><span class="fr-dot" style="background:${PALETTE[(SETUP_PLANETS.length + s.custom.indexOf(c)) % PALETTE.length]}"></span>${escAttr(c)} ✕</button>`).join('')}
      </div>
      <div class="fr-row" style="margin:8px 0 0;"><input class="fr-input" id="suCustom" placeholder="Add your own planet…" maxlength="24"><button class="ics-btn" id="suAddCustom">Add</button></div>
      <p class="su-hint" id="suCount"></p>
      <div class="su-actions"><button class="ics-btn" id="suBack">Back</button><button class="ics-btn" id="suNext">Next</button><button class="su-skip" id="suSkip">Skip setup</button></div>`;
    const picked = [...s.picked, ...s.custom];
    return `
      <h2>Add starting goals</h2>
      <p class="su-sub">Give any planet a first goal — or tell the AI a bit about yourself and let it
      suggest one for each planet. Totally optional: you can add goals anytime with the ✎ buttons.</p>
      <div class="fr-row" style="margin:0 0 4px;">
        <input class="fr-input" id="suAbout" placeholder="About you, for better ideas — e.g. college student, loves hiking" value="${escAttr(s.aboutMe)}" maxlength="200">
        <button class="ics-btn" id="suSuggest">✨ Suggest</button>
      </div>
      <p class="su-hint" id="suGoalMsg" style="margin:0 0 8px;"></p>
      ${picked.map(l => `<label class="ge-field" style="margin:7px 0;">${escAttr(l)}<input class="fr-input su-goal" data-label="${escAttr(l)}" placeholder="(optional) a goal for ${escAttr(l)}" value="${escAttr(s.goals[l] || '')}" maxlength="120" style="width:100%;"></label>`).join('')}
      <div class="su-actions"><button class="ics-btn" id="suBack">Back</button><button class="ics-btn" id="suFinish">Create my solar system</button><button class="su-skip" id="suSkip">Skip setup</button></div>`;
  }

  function renderSetup(){
    setupEl.querySelector('.setup-card').innerHTML = setupHTML();
    const s = setupState;
    const on = (sel, fn) => { const n = setupEl.querySelector(sel); if (n) n.addEventListener('click', fn); };
    on('#suSkip', closeSetup);
    on('#suBack', () => { s.step--; renderSetup(); });
    on('#suNext', () => {
      if (s.step === 1){
        s.name = setupEl.querySelector('#suName').value.trim();
        s.step = 2;
      } else if (s.step === 2){
        if (!s.picked.length && !s.custom.length){ setupEl.querySelector('#suCount').textContent = 'Pick at least one planet to continue.'; return; }
        s.step = 3;
      }
      renderSetup();
    });
    on('#suAddCustom', () => {
      const v = setupEl.querySelector('#suCustom').value.trim();
      if (v && ![...s.picked, ...s.custom].some(x => x.toLowerCase() === v.toLowerCase())) s.custom.push(v);
      renderSetup();
    });
    on('#suFinish', finishSetup);
    // step 3: remember typed goals/context across re-renders
    setupEl.querySelectorAll('.su-goal').forEach(inp => inp.addEventListener('input', () => { s.goals[inp.dataset.label] = inp.value; }));
    const aboutIn = setupEl.querySelector('#suAbout');
    if (aboutIn) aboutIn.addEventListener('input', () => { s.aboutMe = aboutIn.value; });
    on('#suSuggest', async () => {
      const btn = setupEl.querySelector('#suSuggest');
      const msg = setupEl.querySelector('#suGoalMsg');
      const all = [...s.picked, ...s.custom];
      btn.disabled = true; btn.textContent = 'Thinking…';
      msg.textContent = 'Asking the AI for one idea per planet — can take ~20 seconds…';
      try{
        const res = await fetch('/api/suggest', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            question: 'Suggest exactly one short, beginner-friendly starter goal for EACH of these planets: ' + all.join(', ') + '. One goal per planet, no more.',
            config: { title: 'Brand-new solar system', areas: all.map(l => ({ planet: l, goals: [] })) },
            context: (s.aboutMe || '').slice(0, 200),
          }),
        });
        const data = res.ok ? await res.json().catch(() => null) : null;
        if (data && (data.suggestions || []).length){
          data.suggestions.forEach(sg => {
            const match = all.find(l => l.toLowerCase() === String(sg.planet || '').toLowerCase());
            if (match && sg.title && !(s.goals[match] || '').trim()) s.goals[match] = String(sg.title).slice(0, 120);
          });
          renderSetup();
          setupEl.querySelector('#suGoalMsg').textContent = '✨ Ideas filled in — edit or clear any you don’t like.';
          return;
        }
        msg.textContent = res.status === 429
          ? 'The AI hit its hourly limit — type your own for now.'
          : 'The AI isn’t available right now — type your own goals instead.';
      }catch(e){ msg.textContent = 'Couldn’t reach the AI — are you online? Type your own goals instead.'; }
      btn.disabled = false; btn.textContent = '✨ Suggest';
    });
    setupEl.querySelectorAll('.su-chip[data-label]').forEach(ch => ch.addEventListener('click', () => {
      const l = ch.dataset.label;
      s.picked = s.picked.includes(l) ? s.picked.filter(x => x !== l) : [...s.picked, l];
      renderSetup();
    }));
    setupEl.querySelectorAll('.su-chip[data-custom]').forEach(ch => ch.addEventListener('click', () => {
      s.custom = s.custom.filter(x => x !== ch.dataset.custom);
      renderSetup();
    }));
    const nameIn = setupEl.querySelector('#suName');
    if (nameIn){ nameIn.focus(); nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') setupEl.querySelector('#suNext').click(); }); }
    const custIn = setupEl.querySelector('#suCustom');
    if (custIn) custIn.addEventListener('keydown', e => { if (e.key === 'Enter') setupEl.querySelector('#suAddCustom').click(); });
    const cnt = s.picked.length + s.custom.length;
    const cntEl = setupEl.querySelector('#suCount');
    if (cntEl) cntEl.textContent = cnt ? cnt + ' planet' + (cnt > 1 ? 's' : '') + ' chosen' : 'Nothing picked yet — most people keep 4–7.';
  }

  function finishSetup(){
    const s = setupState;
    const areas = SETUP_PLANETS.filter(p => s.picked.includes(p.label)).map(p => ({ label: p.label, color: p.color, goals: [] }));
    s.custom.forEach(c => areas.push({ label: c, color: PALETTE[areas.length % PALETTE.length], goals: [] }));
    areas.forEach(a => {
      const t = (s.goals[a.label] || '').trim();
      if (t) a.goals.push({ title: t.slice(0, 120), status: 'ongoing' }); // starter goals glow
    });
    cfg = {
      title: s.name ? s.name + "'s Life Solar System" : 'My Life Solar System',
      subtitle: "Each planet is a part of life. A green glow means something's actively happening.",
      sunLabel: s.name || 'Me',
      areas,
    };
    if (s.footer) cfg.footer = s.footer;
    store.set('__config', cfg); // saves (and syncs, where hosting supports it)
    // new systems start PUBLIC (announced in the wizard): create a friend code
    // and publish. The 🌍/🔒 toggle in Friends flips this off in one click.
    const soc = social.get();
    if (!soc.code){ soc.code = social.randomCode(); soc.writeKey = social.randomKey(); }
    soc.on = true;
    soc.shareTitles = true;
    social.save(soc);
    setHeaderText();
    build();
    closeSetup();
    startTour(); // fresh system → show them around the tabs once
  }

  // ---- guided tour: a quick lap around the tabs, shown once after setup ----
  const TOUR = [
    { view: 'system',   target: null,            title: 'This is your solar system 🌞',
      text: "You're the sun. Each planet is a part of your life orbiting you, and a green glow means something's actively happening there. Click any planet — or the sun — to look inside." },
    { view: 'system',   target: '#editPlanets',  title: 'Make it yours',
      text: '✎ Edit planets adds, renames, and recolors planets. Open a planet and ✎ Edit goals handles the rest: deadlines, weekly habit circles, milestone checklists.' },
    { view: 'timeline', target: '#viewTimeline', title: 'The Timeline tab',
      text: 'Every goal with a due date, soonest first, with overdue flags. The ⬇ button sends your deadlines to Google/Apple Calendar.' },
    { view: 'progress', target: '#viewProgress', title: 'The Progress tab',
      text: 'Your trophy shelf: finished goals, milestones reached, and an 8-week grid of your weekly habits (with streaks 🔥).' },
    { view: 'friends',  target: '#viewFriends',  title: 'The Friends tab',
      text: "Your system starts 🌍 public — you already have a friend code here. Swap codes with people you like and visit each other's solar systems. The 🔒 toggle makes you fully private, and checkboxes hide specific planets or goals." },
    { view: 'system',   target: null,            title: 'All yours ✨',
      text: "That's the tour. Add a goal or two, tick your habits as the week goes, and come back anytime — everything saves itself." },
  ];
  let tourEl = null, tourIx = 0, tourTarget = null;
  function startTour(){
    if (store.get('__tourDone', false)) return;
    tourIx = 0;
    tourEl = document.createElement('div');
    tourEl.className = 'tour-card';
    document.body.appendChild(tourEl);
    renderTour();
  }
  function renderTour(){
    const step = TOUR[tourIx];
    if (tourTarget) tourTarget.classList.remove('tour-glow');
    setView(step.view);
    tourTarget = step.target ? document.querySelector(step.target) : null;
    if (tourTarget) tourTarget.classList.add('tour-glow');
    const last = tourIx === TOUR.length - 1;
    tourEl.innerHTML = `<h3>${step.title}</h3><p>${step.text}</p>
      <div class="tour-controls">
        <button class="ics-btn" id="tourNext">${last ? 'Done' : 'Next'}</button>
        ${last ? '' : '<button class="su-skip" id="tourSkip" style="margin-left:0;">Skip tour</button>'}
        <span class="tour-step">${tourIx + 1} / ${TOUR.length}</span>
      </div>`;
    tourEl.querySelector('#tourNext').addEventListener('click', () => {
      tourIx++;
      if (tourIx >= TOUR.length) endTour(); else renderTour();
    });
    const sk = tourEl.querySelector('#tourSkip');
    if (sk) sk.addEventListener('click', endTour);
  }
  function endTour(){
    if (tourTarget){ tourTarget.classList.remove('tour-glow'); tourTarget = null; }
    if (tourEl){ tourEl.remove(); tourEl = null; }
    store.set('__tourDone', true); // once is enough
    setView('system');
  }

  function openSetup(){
    if (setupEl) return;
    setupState.footer = cfg.footer || '';
    setupEl = document.createElement('div');
    setupEl.className = 'setup-backdrop';
    setupEl.innerHTML = '<div class="setup-card"></div>';
    document.body.appendChild(setupEl);
    renderSetup();
  }
  function closeSetup(){ if (setupEl){ setupEl.remove(); setupEl = null; } }

  // installable app: register the service worker (hosted copies only)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  window.addEventListener('resize', build);
  build();
  // greet brand-new visitors (data.js opted in, nothing saved yet)
  if (cfg.setup && !store.get('__config', null)) openSetup();
  // pull cloud state, then redraw with the synced data (including planet edits)
  cloudSync.pull(() => {
    applyConfig();
    applyTheme(); // a theme picked on another device may have synced in
    build();
    if (store.get('__config', null)) closeSetup(); // synced config arrived — not a new user
    if (progWrap.style.display === 'block') buildProgress();
    if (friendsWrap.style.display === 'block') buildFriends();
  }).then(() => { socialPublish(); checkInbox(); }); // fresh hub summary + collect any waves/kudos
</script>
</body>
</html>
